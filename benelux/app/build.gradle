plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = file('signing.env')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'nl.jays.boodschappenbenelux'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.jays.boodschappenbenelux'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.0.8'
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword signing.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias signing.getProperty('RELEASE_KEY_ALIAS', '')
            keyPassword signing.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'

    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

