name: Bouw Boodschappen BeNeLux-Duitsland
on:
  workflow_dispatch:
  push:
    branches: [codex/boodschappen-benelux]
    paths: ['benelux/**', '.github/workflows/benelux.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Release sleutel herstellen
        shell: bash
        env:
          RELEASE_BUNDLE: ${{ secrets.ANDROID_RELEASE_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_BUNDLE"
          printf '%s' "$RELEASE_BUNDLE" | base64 --decode > /tmp/release-bundle.tar.gz
          tar -xzf /tmp/release-bundle.tar.gz -C benelux/app
          test -s benelux/app/release.jks
          test -s benelux/app/signing.env
      - name: Bouw release APK
        run: cd benelux && gradle --no-daemon :app:assembleRelease
      - name: APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-BeNeLux-Duitsland-1.0.1
          path: benelux/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
