name: Bouw Boodschappen BeNeLux-Duitsland
on:
  workflow_dispatch:
  push:
    branches: [codex/boodschappen-benelux]
    paths: ['benelux/**', '.github/workflows/benelux.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Bouw APK
        run: cd benelux && gradle --no-daemon :app:assembleDebug
      - name: APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-BeNeLux-Duitsland-1.0.0
          path: benelux/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
