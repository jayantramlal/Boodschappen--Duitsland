name: Bouw Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.6.0"

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK 37 installeren
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            --channel=3

      - name: Gradle 9.6.0 installeren
        shell: bash
        run: |
          set -e

          GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="$HOME/gradle"

          rm -rf "$GRADLE_DIR"
          rm -f "$GRADLE_ZIP"

          echo "Gradle ${GRADLE_VERSION} downloaden..."

          if ! curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          then
            echo "Eerste Gradle-server mislukt. Tweede server proberen..."

            rm -f "$GRADLE_ZIP"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$GRADLE_ZIP" \
              "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          fi

          unzip -t "$GRADLE_ZIP" > /dev/null

          mkdir -p "$GRADLE_DIR"

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          echo "GRADLE_HOME=$GRADLE_DIR/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"

      - name: Gradle controleren
        run: |
          gradle --version

      - name: Broncode ZIP zoeken en uitpakken
        shell: bash
        run: |
          set -e

          SOURCE_ZIP=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'BoodschappenDuitsland-Android-*-source.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "FOUT: Geen broncode ZIP gevonden."
            ls -la
            exit 1
          fi

          echo "Broncode gevonden:"
          echo "$SOURCE_ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Broncode succesvol uitgepakt."

      - name: Android project zoeken
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FOUT: Android project niet gevonden."
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project gevonden:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Barcode callbacks herstellen
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          files = list(project.rglob("Screens.kt"))

          if not files:
              raise SystemExit("FOUT: Screens.kt niet gevonden.")

          file = files[0]

          print("Screens.kt gevonden:")
          print(file)

          text = file.read_text(encoding="utf-8")

          print()
          print("Alle launchScanner verwijzingen:")

          for number, line in enumerate(text.splitlines(), 1):
              if "launchScanner" in line:
                  print(f"{number}: {line}")

          pattern = re.compile(
              r'\b(onScan|onScanNext)\s*=\s*launchScanner(\s*,?)'
          )

          already_fixed_pattern = re.compile(
              r'\b(onScan|onScanNext)\s*=\s*'
              r'\{\s*launchScanner\(\)\s*;\s*Unit\s*\}'
          )

          matches = list(pattern.finditer(text))
          already_fixed = list(already_fixed_pattern.finditer(text))

          print()
          print(f"Nog te repareren callbacks: {len(matches)}")
          print(f"Al gerepareerde callbacks: {len(already_fixed)}")

          total = len(matches) + len(already_fixed)

          if total != 3:
              raise SystemExit(
                  "VEILIGHEIDSSTOP: verwacht in totaal precies 3 "
                  "barcode-callbacks, maar vond "
                  f"{len(matches)} niet-gerepareerde en "
                  f"{len(already_fixed)} gerepareerde callbacks."
              )

          if matches:
              def replace_callback(match):
                  callback_name = match.group(1)
                  trailing = match.group(2)

                  return (
                      f"{callback_name} = "
                      "{ launchScanner(); Unit }"
                      f"{trailing}"
                  )

              text, replacements = pattern.subn(
                  replace_callback,
                  text
              )

              print()
              print(
                  f"Aantal automatisch gerepareerde callbacks: "
                  f"{replacements}"
              )

              file.write_text(
                  text,
                  encoding="utf-8"
              )

          check = file.read_text(encoding="utf-8")

          remaining = list(pattern.finditer(check))

          fixed_after = list(
              already_fixed_pattern.finditer(check)
          )

          print()
          print(
              f"Callbacks na reparatie: {len(fixed_after)}"
          )

          if remaining:
              raise SystemExit(
                  "FOUT: er zijn nog ongerepareerde "
                  "barcode callbacks aanwezig."
              )

          if len(fixed_after) != 3:
              raise SystemExit(
                  "FOUT: na reparatie zijn niet exact "
                  "3 callbacks correct."
              )

          print()
          print("Alle 3 barcode callbacks zijn correct hersteld.")

          print()
          print("Controle van aangepaste regels:")

          for number, line in enumerate(
              check.splitlines(),
              1
          ):
              if (
                  "onScan =" in line
                  or "onScanNext =" in line
              ):
                  print(f"{number}: {line}")
          PY

      - name: Android project controleren
        shell: bash
        run: |
          set -e

          echo "Projectmap:"
          echo "$PROJECT_DIR"

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: APK bouwen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --console=plain \
            --no-daemon

      - name: APK zoeken en verzamelen
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          echo "Gevonden APK-bestanden:"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FOUT: Build uitgevoerd, maar geen APK gevonden."
            exit 1
          fi

          echo
          echo "$APK_COUNT APK-bestand(en) succesvol gevonden."

      - name: APK klaarzetten
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-Duitsland-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
