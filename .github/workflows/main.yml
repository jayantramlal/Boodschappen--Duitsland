name: Bouw Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.6.0"

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK 37 installeren
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            --channel=3

      - name: Gradle 9.6.0 installeren
        shell: bash
        run: |
          set -e

          GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="$HOME/gradle"

          rm -rf "$GRADLE_DIR"
          rm -f "$GRADLE_ZIP"

          echo "Gradle ${GRADLE_VERSION} downloaden..."

          if ! curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          then
            echo "Eerste Gradle-server mislukt. Tweede server proberen..."

            rm -f "$GRADLE_ZIP"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$GRADLE_ZIP" \
              "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          fi

          echo "Gradle ZIP controleren..."

          unzip -t "$GRADLE_ZIP" > /dev/null

          mkdir -p "$GRADLE_DIR"

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "GRADLE_HOME=$GRADLE_DIR/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"

      - name: Gradle controleren
        run: |
          gradle --version

      - name: Broncode ZIP zoeken en uitpakken
        shell: bash
        run: |
          set -e

          SOURCE_ZIP=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'BoodschappenDuitsland-Android-*-source.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "FOUT: Geen broncode ZIP gevonden."
            echo "Bestanden in repository:"
            ls -la
            exit 1
          fi

          echo "Broncode gevonden:"
          echo "$SOURCE_ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Broncode succesvol uitgepakt."

      - name: Android project zoeken
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FOUT: settings.gradle of settings.gradle.kts niet gevonden."
            echo
            echo "Bestanden in uitgepakte broncode:"
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project gevonden in:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android project controleren
        shell: bash
        run: |
          set -e

          echo "Projectmap:"
          echo "$PROJECT_DIR"

          echo
          echo "Bestanden:"
          ls -la "$PROJECT_DIR"

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: APK bouwen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: APK zoeken en verzamelen
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          echo "Gevonden APK-bestanden:"
          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FOUT: De Android-build is uitgevoerd, maar er is geen APK gevonden."
            exit 1
          fi

          echo
          echo "$APK_COUNT APK-bestand(en) succesvol gevonden."

      - name: APK klaarzetten
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-Duitsland-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
