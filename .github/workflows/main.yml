name: Bouw Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK 37 installeren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            --channel=3

      - name: Gradle 9.6.0 installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Broncode ZIP zoeken en uitpakken
        run: |
          SOURCE_ZIP=$(find . -maxdepth 1 -type f \
            -name 'BoodschappenDuitsland-Android-*-source.zip' \
            | sort -V | tail -n 1)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "FOUT: Broncode ZIP niet gevonden."
            echo "Bestanden in repository:"
            ls -la
            exit 1
          fi

          echo "Gevonden broncode: $SOURCE_ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Broncode succesvol uitgepakt."

      - name: Android project zoeken
        run: |
          SETTINGS_FILE=$(find extracted \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FOUT: settings.gradle of settings.gradle.kts niet gevonden."
            echo "Inhoud van broncode:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project gevonden:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Project controleren
        run: |
          echo "Projectmap:"
          echo "$PROJECT_DIR"

          echo "Bestanden in projectmap:"
          ls -la "$PROJECT_DIR"

          echo "Gradle versie:"
          gradle --version

      - name: APK bouwen
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: APK zoeken en verzamelen
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          echo "Gevonden APK-bestanden:"
          find "$GITHUB_WORKSPACE/apk-output" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$GITHUB_WORKSPACE/apk-output" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FOUT: Build uitgevoerd, maar geen APK gevonden."
            exit 1
          fi

      - name: APK klaarzetten
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-Duitsland-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
