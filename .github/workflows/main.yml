name: Bouw Boodschappen Duitsland APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Broncode uitpakken
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'BoodschappenDuitsland-Android-*-source.zip' | sort -V | tail -n 1)
          test -n "$ZIP" || { echo "Geen broncode-ZIP gevonden"; exit 1; }
          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP" -d build-src
          SETTINGS=$(find build-src -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS" || { echo "Geen Android-project gevonden"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Release sleutel herstellen
        shell: bash
        env:
          RELEASE_BUNDLE: ${{ secrets.ANDROID_RELEASE_BUNDLE_BASE64 }}
        run: |
          set -e
          test -n "$RELEASE_BUNDLE" || { echo "ANDROID_RELEASE_BUNDLE_BASE64 ontbreekt"; exit 1; }
          printf '%s' "$RELEASE_BUNDLE" | base64 --decode > /tmp/release-bundle.tar.gz
          tar -xzf /tmp/release-bundle.tar.gz -C "$PROJECT_DIR/app"
          test -s "$PROJECT_DIR/app/release.jks"
          test -s "$PROJECT_DIR/app/signing.env"

      - name: Release APK bouwen
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease

      - name: APK en SHA klaarzetten
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "Geen release-APK gevonden"; exit 1; }
          mkdir -p artifact
          cp "$APK" artifact/Boodschappen-Duitsland.apk
          sha256sum artifact/Boodschappen-Duitsland.apk > artifact/SHA256SUMS.txt

      - name: APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-Duitsland-APK
          path: artifact/*
          if-no-files-found: error
          retention-days: 90
