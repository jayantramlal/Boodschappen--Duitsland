name: Bouw Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.6.0"

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK instellen
        uses: android-actions/setup-android@v3

      - name: Android SDK 37 installeren
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            --channel=3

      - name: Gradle 9.6.0 installeren
        shell: bash
        run: |
          set -e

          GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="$HOME/gradle"

          rm -rf "$GRADLE_DIR"
          rm -f "$GRADLE_ZIP"

          echo "Gradle ${GRADLE_VERSION} downloaden..."

          if ! curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$GRADLE_ZIP" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          then
            echo "Eerste server mislukt. Tweede server proberen..."

            rm -f "$GRADLE_ZIP"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$GRADLE_ZIP" \
              "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          fi

          unzip -t "$GRADLE_ZIP" > /dev/null

          mkdir -p "$GRADLE_DIR"
          unzip -q "$GRADLE_ZIP" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          echo "GRADLE_HOME=$GRADLE_DIR/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"

      - name: Gradle controleren
        run: |
          gradle --version

      - name: Broncode ZIP zoeken en uitpakken
        shell: bash
        run: |
          set -e

          SOURCE_ZIP=$(find . \
            -maxdepth 1 \
            -type f \
            -name 'BoodschappenDuitsland-Android-*-source.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "FOUT: Geen broncode ZIP gevonden."
            ls -la
            exit 1
          fi

          echo "Broncode gevonden:"
          echo "$SOURCE_ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Broncode succesvol uitgepakt."

      - name: Android project zoeken
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FOUT: settings.gradle of settings.gradle.kts niet gevonden."
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project gevonden:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Barcode callback fouten herstellen
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          matches = list(project.rglob("Screens.kt"))

          if not matches:
              raise SystemExit("FOUT: Screens.kt niet gevonden.")

          file = matches[0]

          print("Screens.kt gevonden:")
          print(file)

          lines = file.read_text(encoding="utf-8").splitlines()

          target_lines = [84, 97, 112]
          changed = 0

          for number in target_lines:
              index = number - 1

              if index >= len(lines):
                  raise SystemExit(
                      f"FOUT: regel {number} bestaat niet in Screens.kt."
                  )

              line = lines[index]

              print()
              print(f"Originele regel {number}:")
              print(line)

              if "startScan()" not in line:
                  raise SystemExit(
                      f"VEILIGHEIDSSTOP: regel {number} bevat geen startScan(). "
                      "Broncode wijkt af van de onderzochte build."
                  )

              if "; Unit" in line:
                  print("Regel was al gecorrigeerd.")
                  continue

              closing_brace = line.rfind("}")

              if closing_brace == -1:
                  raise SystemExit(
                      f"VEILIGHEIDSSTOP: regel {number} kan niet veilig "
                      "automatisch worden aangepast."
                  )

              line = (
                  line[:closing_brace]
                  + "; Unit "
                  + line[closing_brace:]
              )

              lines[index] = line
              changed += 1

              print(f"Nieuwe regel {number}:")
              print(line)

          file.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print()
          print(f"Aantal gecorrigeerde regels: {changed}")

          if changed not in (0, 3):
              raise SystemExit(
                  "VEILIGHEIDSSTOP: niet exact alle drie de scanner-callbacks "
                  "konden worden gecorrigeerd."
              )
          PY

      - name: Android project controleren
        shell: bash
        run: |
          set -e

          echo "Projectmap:"
          echo "$PROJECT_DIR"

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: APK bouwen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: APK zoeken en verzamelen
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          echo "Gevonden APK-bestanden:"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FOUT: Build uitgevoerd, maar geen APK gevonden."
            exit 1
          fi

          echo
          echo "$APK_COUNT APK-bestand(en) succesvol gevonden."

      - name: APK klaarzetten
        uses: actions/upload-artifact@v4
        with:
          name: Boodschappen-Duitsland-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
